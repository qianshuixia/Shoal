# Builds the self-contained Windows desktop installer and publishes it as a GitHub Release.
# Every push to main bumps the patch version, builds the installer and publishes it right away;
# it also runs from the Actions tab, or on a tag matching the app version: git tag v0.1.0 && git push origin v0.1.0
# CI writes the version back to main with GITHUB_TOKEN, which does not trigger another push workflow.
# Once a version is published its installer is never replaced: builds for that version stop early until the version is bumped.
name: Release desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-desktop
  # Preserve each queued push and serialize version allocation, including tag/manual runs.
  queue: max
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check release version logic
        run: node --test scripts/bump-release-version.test.mjs

      - name: Advance the desktop version on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main --tags
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch release history' }
            # A queued run starts from the latest main, including any earlier version commit.
            git checkout --detach origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out main' }
            node scripts/bump-release-version.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Cannot advance desktop version' }
            $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            git add desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage version files' }
            git commit -m "chore(release): v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit desktop version' }
            # Reserve the tag with the version commit so a later build cannot attach to another commit.
            git tag "v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot reserve release tag' }
            git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
            if ($LASTEXITCODE -eq 0) { break }
            git tag -d "v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot clean up the local release tag' }
            if ($attempt -eq 3) { throw 'Cannot save desktop version after 3 attempts' }
            # A main/tag push won the race: fetch and allocate again, without force pushing.
          }

      - name: Record the exact build commit
        id: version
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read build commit' }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
          }

      - name: Skip versions that are already published
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $draft = gh release view "v$version" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') {
            "::notice::v$version is already published; bump version in desktop/src-tauri/tauri.conf.json to build a new release."
            "published=true" >> $env:GITHUB_OUTPUT
          } else {
            "published=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.published != 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.release.outputs.published != 'true'
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cache the bundled Node runtime
        if: steps.release.outputs.published != 'true'
        uses: actions/cache@v6
        with:
          path: .tmp/node-runtime
          key: node-runtime-${{ hashFiles('scripts/stage-desktop.mjs') }}

      - run: npm ci
        if: steps.release.outputs.published != 'true'

      - name: Build release notes
        id: notes
        if: steps.release.outputs.published != 'true'
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'release-body.md'
          node scripts/release-notes.mjs $file
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build release notes' }
          $delim = "RELEASE_BODY_$([guid]::NewGuid().ToString('N'))"
          $text = (Get-Content $file -Raw -Encoding UTF8).TrimEnd()
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value "body<<$delim`n$text`n$delim"

      - uses: tauri-apps/tauri-action@v1
        if: steps.release.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Shoal v__VERSION__
          releaseCommitish: ${{ steps.version.outputs.commit }}
          releaseDraft: false
          uploadUpdaterJson: false
          releaseBody: ${{ steps.notes.outputs.body }}
